project-id: "TestPear"
destination_path: "/mnt/workdata2/user_worktmp/lucas.fein/verify_pear"

steps:
    fastq_in (fastq_source):
        pattern: /mnt/workdata2/user_worktmp/lucas.fein/data/mcbath[AB]*.fastq
        first_read: _1
        second_read: _2
        group: (mcbath*)
        paired_end: yes

    trimmomatic:
      _depends: fastq_in
      paired-end: True
      steps: [['SLIDINGWINDOW', 12, 35]]

tools:
    pigz:
        path: pigz
        get_version: '--version'
        exit_code: 0
    pear:
         path: pear
         get_version: '0.9.6'
    mv:
        path: mv
        get_version: '--version'
        exit_code: 0
    mkdir:
        path: mkdir
        get_version: '--version'
        exit_code: 0
